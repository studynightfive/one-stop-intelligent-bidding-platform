[project]
name = "bid-platform-backend"
version = "0.1.0"
description = "一站式智能招投标平台模块化单体后端"
requires-python = ">=3.11.11,<3.12"
dependencies = [
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "celery==5.4.0",
  "cryptography==44.0.0",
  "fastapi==0.115.6",
  "flower==2.0.1",
  "httpx==0.28.1",
  "langgraph==0.2.60",
  "minio==7.2.12",
  "orjson==3.10.12",
  "prometheus-client==0.21.1",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "pyjwt==2.10.1",
  "python-multipart==0.0.20",
  "pyyaml==6.0.3",
  "redis==5.2.1",
  "sqlalchemy==2.0.36",
  "structlog==24.4.0",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.26.5",
  "jsonschema==4.23.0",
  "mypy==1.14.1",
  "openapi-spec-validator==0.7.2",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["app/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/contracts/generated/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["app/contracts/generated/"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
