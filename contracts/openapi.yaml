components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    PortalBearer:
      type: http
      scheme: bearer
      bearerFormat: PortalJWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    PortalRefreshCookie:
      type: apiKey
      in: cookie
      name: portal_refresh_token
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端可提供的链路标识；服务端必须回显或生成。
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 实体整数版本，格式为双引号包围的数字。
      schema:
        type: string
        pattern: ^"\d+"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一业务动作重试时必须复用，建议 UUID/ULID。
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: 请求格式错误。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: 未认证或令牌过期。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: *id001
    Forbidden:
      description: 无操作权限。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: *id001
    NotFound:
      description: 资源不存在或因租户隔离不可见。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: *id001
    Conflict:
      description: 状态、版本或幂等冲突。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: *id001
    ValidationError:
      description: 字段校验失败。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: *id001
    RateLimited:
      description: 请求频率过高。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content: *id001
    InternalError:
      description: 服务内部错误。
      headers:
        X-Request-Id:
          description: 请求链路标识；服务端生成或回显客户端值。
          schema:
            type: string
            minLength: 1
      content: *id001
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
    IsoDate:
      type: string
      format: date
    IsoDateTime:
      type: string
      format: date-time
    Money:
      type: string
      pattern: ^-?(0|[1-9]\d*)\.\d{2}$
      examples:
      - '5000000.00'
    Currency:
      type: string
      enum:
      - CNY
    Role:
      type: string
      enum:
      - admin
      - project_lead
      - member
      - reviewer
    UserStatus:
      type: string
      enum:
      - invited
      - active
      - disabled
    BidTaskStatus:
      type: string
      enum:
      - draft
      - parsing
      - material_prep
      - ai_review
      - pending_output
      - completed
      - archived
      - failed
    BidMaterialStatus:
      type: string
      enum:
      - pending
      - have
      - missing
      - template
      - uploaded
      - expiring
      - rejected
    EvaluationStatus:
      type: string
      enum:
      - draft
      - collecting
      - pending
      - ai_review
      - human_review
      - completed
      - closed
      - cancelled
    SupplierStatus:
      type: string
      enum:
      - invited
      - partial
      - submitted
      - supplementing
      - qualified
      - disqualified
      - overdue
      - withdrawn
    QualificationStatus:
      type: string
      enum:
      - valid
      - expiring
      - expired
      - revoked
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
    RiskSeverity:
      type: string
      enum:
      - info
      - warning
      - high
      - critical
    Decision:
      type: string
      enum:
      - pending
      - passed
      - rejected
    RealtimeChannel:
      type: string
      enum:
      - internal
      - portal
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - UNAUTHENTICATED
      - TOKEN_EXPIRED
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - VERSION_CONFLICT
      - RATE_LIMITED
      - DEADLINE_PASSED
      - INVALID_STATE_TRANSITION
      - FILE_REJECTED
      - VIRUS_DETECTED
      - AI_PROVIDER_UNAVAILABLE
      - JOB_FAILED
      - INTERNAL_ERROR
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
          properties: {}
      required:
      - code
      - message
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        requestId:
          type: string
          minLength: 1
      required:
      - success
      - error
      - requestId
    PaginationMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - page
      - pageSize
      - total
      - totalPages
    FileRef:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        scanStatus:
          type: string
          enum:
          - pending
          - clean
          - infected
          - failed
        previewUrl:
          type: string
          format: uri
        downloadUrl:
          type: string
          format: uri
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
      required:
      - id
      - fileName
      - mimeType
      - sizeBytes
      - sha256
      - scanStatus
      - createdAt
    JobError:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
    JobRef:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        currentStep:
          type: string
        result:
          type: object
          additionalProperties: true
          properties: {}
        error:
          $ref: '#/components/schemas/JobError'
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
      required:
      - id
      - type
      - status
      - progressPercent
      - createdAt
    UserSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - name
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenantId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        projectCount:
          type: integer
          minimum: 0
        lastLoginAt:
          $ref: '#/components/schemas/IsoDateTime'
        version:
          type: integer
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
      required:
      - id
      - tenantId
      - name
      - email
      - role
