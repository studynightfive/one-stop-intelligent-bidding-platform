      x-frontend-owner: M3
      x-permission: 公开
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security: []
      responses:
        '200':
          description: 操作成功。
          headers:
            X-Request-Id:
              description: 请求链路标识；服务端生成或回显客户端值。
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AuthSession'
                  requestId:
                    type: string
                    minLength: 1
                required:
